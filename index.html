<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yunhua Zhao | Homepage</title>
    
    <!-- Load CSS from private repo -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Yunhua468/portfolio-source@main/styles/style.css">
    
    <!-- Fallback if direct loading fails -->
    <style>
        .hidden-content {
            display: none;
        }
        .error-message {
            color: #d9534f;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="page-container">

    <!-- NAVIGATION - Hardcoded in this file -->
    <div class="nav-wrapper">
        <nav class="sidebar">
            <ul>
                <li class="active"><a href="#" data-page="home">Home</a></li>
                <li><a href="#" data-page="cv">CV</a></li>
                <li><a href="#" data-page="publications">Publications</a></li>
                <li><a href="#" data-page="teaching">Teaching</a></li>
            </ul>
        </nav>
    </div>

    <!-- DYNAMIC CONTENT AREA -->
    <div class="main-content-area">
        <main class="content" id="content-area">
            <!-- Content loaded via JavaScript -->
            <div id="loading">Loading your portfolio...</div>
        </main>
    </div>

    <!-- STATIC SIDEBAR - Hardcoded here -->
    <div class="image-sidebar">
        <div class="profile-image-container">
            <img src="https://cdn.jsdelivr.net/gh/Yunhua468/portfolio-source@main/images/image.jpg" 
                 alt="Yunhua Zhao" 
                 class="profile-image"
                 onerror="this.style.display='none';">
            <div class="image-caption">
                <p>Yunhua Zhao</p>
                <p>Ph.D. Candidate</p>
                <p>Computer Science</p>
                <p>CUNY Graduate Center</p>
            </div>
        </div>
        
        <div class="contact-info">
            <h3>Contact</h3>
            <p><strong>Email:</strong> yzhao5@gradcenter.cuny.edu</p>
            <a href="https://github.com/Yunhua468" target="_blank" class="profile-link">
                <i class="fab fa-github"></i> GitHub
            </a>
            <p><strong>Location:</strong> New York, NY</p>
        </div>
    </div>

</div>

<script>
    const CDN_BASE = 'https://cdn.jsdelivr.net/gh/Yunhua468/portfolio-source@main/';

    const pages = {
        'home': 'index.html',
        'cv': 'pages/cv.pdf',
        'publications': 'pages/Publications.html',
        'teaching': 'pages/Teaching.html'
    };
    
    document.addEventListener('DOMContentLoaded', function() {
        loadPage('home');
        
        document.querySelectorAll('.sidebar a[data-page]').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const page = this.getAttribute('data-page');
                loadPage(page);
                
                document.querySelectorAll('.sidebar li').forEach(li => {
                    li.classList.remove('active');
                });
                this.parentElement.classList.add('active');
            });
        });
    });
    
    async function loadPage(page) {
        const contentArea = document.getElementById('content-area');
        
        if (page === 'cv') {
            window.open(CDN_BASE + pages[page], '_blank');
            return;
        }
        
        contentArea.innerHTML = '<div id="loading">Loading...</div>';
        
        try {
            const response = await fetch(CDN_BASE + pages[page]);
            
            if (!response.ok) {
                throw new Error('Failed to load content');
            }
            
            const html = await response.text();
            
            // Parse and extract content
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            const content = doc.querySelector('.content') || 
                           doc.querySelector('main') || 
                           doc.body.querySelector('div:first-child');
            
            contentArea.innerHTML = content ? content.innerHTML : html;
            
        } catch (error) {
            contentArea.innerHTML = `
                <div class="error-message">
                    <h3>Content Unavailable</h3>
                    <p>The requested content could not be loaded.</p>
                    <p>This is a demo of how content would be loaded from a private repository.</p>
                </div>
            `;
            console.error('Error:', error);
        }
    }
</script>

</body>
</html>
